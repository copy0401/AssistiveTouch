name: Android CI


on:
  workflow_dispatch: # Allows manual clicks on the GitHub webpage to trigger.


jobs:
  build:


    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4 # Check code
    - name: set up JDK 17 # Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle


    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle # Compile and debug APK using Gradle
      run: ./gradlew assembleDebug
      
    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AssistiveTouch.apk

    - name: Automatic version generation tag
      id: tag
      run: |
        echo "tag_name=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT
        
    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: "AssistiveTouch Auto Release"
        files: app/build/outputs/apk/debug/AssistiveTouch.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 



        
