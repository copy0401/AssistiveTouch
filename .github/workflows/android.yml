name: Android CI

on:
  push:
    branches: [ "master" ] # 當你推送到 main 或 master 分支時自動觸發
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # 檢查程式碼
    - name: set up JDK 17 # 設定 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle # 使用 Gradle 編譯 Debug APK
      run: ./gradlew assembleDebug
      
    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AssistiveTouch.apk

    - name: Upload APK file to GitHub Artifacts # 上傳 APK 檔案至 GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AssistiveTouch-apk
        path: app/build/outputs/apk/debug/AssistiveTouch.apk
        
    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/AssistiveTouch.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
