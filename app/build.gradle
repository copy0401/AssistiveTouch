apply plugin: 'com.android.application'

android {
    namespace 'com.android.mirror.assisttouch'
    compileSdk 34

    defaultConfig {
        applicationId "com.android.mirror.assisttouch"
        minSdk 26
        targetSdk 34
        versionCode 10200
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
